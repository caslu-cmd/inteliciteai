name: Deploy para Cloudflare

# Publica automaticamente a cada push na main (branch de produção).
# Também pode ser disparado manualmente em Actions › Deploy para Cloudflare › Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dois deploys simultâneos; o mais recente vence.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      # Usa o wrangler 4 (mesma versão do deploy manual). A action oficial
      # instala uma versão 3 antiga que não publica sites só de assets.
      - name: Publicar no Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
